name: suite

# Called by each plugin's own .github/workflows/suite.yml on pull_request:
#
#   on: pull_request
#   jobs:
#     vim-suite:
#       uses: vimoured/vim-suite/.github/workflows/suite.yml@main
#
# The whole suite runs with that plugin at the pull request's head commit and
# every other repository at main, then the smoke test (smoke.yml, bin/smoke)
# with that plugin at that commit. Any repository of ours, this one included,
# with a branch named as the pull request's is used at that branch: name the
# branches of a change across repositories alike, and they're tested together.
# The dotfiles call it the same way, for a
# pull request that changes what the suite reads of them (their
# .github/workflows/vim-suite.yml). Or run it by hand, everything at main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      # The Vim the suite runs on, built below
      VIM_TAG: v9.2.0000
    steps:
      # When called, github.* describes the plugin's pull request, so name
      # this repository explicitly
      - uses: actions/checkout@v5
        with:
          repository: vimoured/vim-suite
          ref: main
      - name: Use this repository's branch of the same name
        if: github.event_name == 'pull_request' && github.head_ref != 'main'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch --quiet --depth 1 origin "refs/heads/$BRANCH"
            git checkout --quiet --detach FETCH_HEAD
            echo "vim-suite at $BRANCH ($(git rev-parse --short HEAD))"
          fi
      # Vim with +clipboard and no GUI, as on a desktop terminal, so the
      # dotfiles' "+ mappings run. Ubuntu has no such package: its vim has no
      # clipboard, and its vim-gtk3 (a GUI build) doesn't fire CmdlineChanged
      # at an input() prompt here, which the specs keeping a prompt's text
      # need. So built from source once (X11 clipboard) and cached; the suite
      # runs on a virtual display (Xvfb), for a clipboard to be there
      - name: Cache Vim
        id: vim-cache
        uses: actions/cache@v4
        with:
          path: ~/vim
          key: vim-${{ env.VIM_TAG }}-x11-nogui-${{ runner.os }}-${{ runner.arch }}
      # rg and fd for fzf-utils, which defines its searches only when they're
      # installed. Ubuntu's fd is fdfind: fd is linked to it
      - name: Install Vim's libraries, ripgrep and fd
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev libx11-dev libxt-dev xvfb ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          rg --version | head -n 1
          fd --version
      - name: Build Vim
        if: steps.vim-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch "$VIM_TAG" https://github.com/vim/vim "$RUNNER_TEMP/vim-src"
          cd "$RUNNER_TEMP/vim-src"
          ./configure --quiet --prefix="$HOME/vim" --with-features=huge --enable-gui=no --with-x
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
      - name: Use the built Vim
        run: |
          echo "$HOME/vim/bin" >>"$GITHUB_PATH"
          "$HOME/vim/bin/vim" --version | head -n 1
          "$HOME/vim/bin/vim" --version | grep -q '+clipboard' && echo +clipboard
      # For the dotfiles' Python parts (pdbpp reading ~/.pdbrc.py); bin/fetch
      # makes deps/python from it with test/requirements.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Fetch the plugins and dotfiles
        env:
          SUITE_PYTHON: python
          SUITE_PYTEST: 0
        run: bin/fetch
      # Real pytest runs (pytest.vim's spec)
      # only for a Python-related change: a pull request of pytest.vim,
      # project-detect or the dotfiles, or a run by hand. Elsewhere those
      # tests are TODO skips
      - name: Install pytest (Python-related changes)
        if: >-
          github.event_name != 'pull_request' ||
          contains(fromJSON('["pytest.vim", "project-detect", "dotfiles"]'), github.event.repository.name)
        run: deps/python/bin/python -m pip install --quiet -r test/requirements-pytest.txt
      # A change across repositories: its branches share the pull request's name
      - name: Check out the branches of the same name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: bin/pin-branch "$BRANCH" >"$RUNNER_TEMP/pins"
      # A plugin's pull request, or the dotfiles'
      - name: Check out the pull request's commit
        if: github.event_name == 'pull_request'
        env:
          NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bin/pin "$NAME" "$SHA"
          echo "$NAME $SHA" >>"$RUNNER_TEMP/pins"
      - name: Run the suite
        run: xvfb-run -a bin/test
      # The dotfiles in deps/ (at the pull request's commit, for theirs), every
      # plugin they Plug at main, except the ones pinned above
      - name: Smoke test
        run: |
          pins=$(grep -v '^dotfiles ' "$RUNNER_TEMP/pins" 2>/dev/null || true)
          bin/smoke deps/dotfiles $pins
