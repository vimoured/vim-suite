name: suite

# Called by each plugin's own .github/workflows/suite.yml on pull_request:
#
#   on: pull_request
#   jobs:
#     vim-suite:
#       uses: vimoured/vim-suite/.github/workflows/suite.yml@main
#
# The whole suite runs with that plugin at the pull request's head commit and
# every other repository at main. Or run it by hand, everything at main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      # When called, github.* describes the plugin's pull request, so name
      # this repository explicitly
      - uses: actions/checkout@v5
        with:
          repository: vimoured/vim-suite
          ref: main
      - name: Install Vim and the programs the plugins run
        run: |
          sudo apt-get update
          sudo apt-get install -y vim tmux entr
          vim --version | head -n 1
          # glow, at the version I use (not packaged by Ubuntu)
          curl -fsSL https://github.com/charmbracelet/glow/releases/download/v2.1.2/glow_2.1.2_Linux_x86_64.tar.gz |
            sudo tar -xz -C /usr/local/bin --strip-components=1 glow_2.1.2_Linux_x86_64/glow
          glow --version
      # For the dotfiles' Python parts (pdbpp reading ~/.pdbrc.py); bin/fetch
      # makes deps/python from it with test/requirements.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Fetch the plugins and dotfiles
        env:
          SUITE_PYTHON: python
        run: bin/fetch
      - name: Check out the pull request's plugin
        if: github.event_name == 'pull_request'
        env:
          NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/pin "$NAME" "$SHA"
      - name: Run the suite
        run: bin/test
