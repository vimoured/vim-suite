name: suite

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim
          vim --version | head -n 1
      - name: Fetch the plugins and dotfiles
        run: bin/fetch
      - name: Run the suite
        run: bin/test
