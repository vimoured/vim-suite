name: suite

# Called by each plugin's own .github/workflows/suite.yml on pull_request:
#
#   on: pull_request
#   jobs:
#     vim-suite:
#       uses: vimoured/vim-suite/.github/workflows/suite.yml@main
#
# The whole suite runs with that plugin at the pull request's head commit and
# every other repository at main. Or run it by hand, everything at main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      # When called, github.* describes the plugin's pull request, so name
      # this repository explicitly
      - uses: actions/checkout@v5
        with:
          repository: vimoured/vim-suite
          ref: main
      # rg and fd for fzf-utils, which defines its searches only when they're
      # installed. Ubuntu's fd is fdfind: fd is linked to it
      - name: Install Vim, ripgrep and fd
        run: |
          sudo apt-get update
          sudo apt-get install -y vim ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          vim --version | head -n 1
          rg --version | head -n 1
          fd --version
      # For the dotfiles' Python parts (pdbpp reading ~/.pdbrc.py); bin/fetch
      # makes deps/python from it with test/requirements.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Fetch the plugins and dotfiles
        env:
          SUITE_PYTHON: python
        run: bin/fetch
      - name: Check out the pull request's plugin
        if: github.event_name == 'pull_request'
        env:
          NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/pin "$NAME" "$SHA"
      - name: Run the suite
        run: bin/test
